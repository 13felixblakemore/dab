environment:
  explorable: false
  movement_noise: 0.0
  include_stay_action: false
features:
  mode: rbf
  dim: 5
  sigma: 0.1
agent:
  embed_dim: 8
  hidden_dim: 32
  num_layers: 1
  batch_size: 8
  temperature: 10.0
  max_grad_norm: 10.0
training:
  epochs: 2
  transitions_per_epoch: 50
  rollout_horizon: 10
  updates_per_epoch: 2
  min_buffer_size: 8
  buffer_size: 1000
  output_dir: results/smoke
  checkpoint_every: 1
  plot: true
  backend: jax
  num_envs: 25
